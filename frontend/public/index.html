    <!-- Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ClipGrabber",
      "description": "Free social media video and image downloader for YouTube, Instagram, TikTok, Facebook and Pinterest",
      "url": "%REACT_APP_SITE_URL%",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <title>ClipGrabber — Free YouTube, Instagram, TikTok, Facebook & Pinterest Downloader</title>

    <!--
      Ad network loaders are injected conditionally at runtime so nothing
      requests ads (or fails loudly) when the corresponding env var isn't
      set — e.g. in local dev, previews, or before ad-network approval.
    -->
    <script>
      (function () {
        var adsenseClient = "%REACT_APP_ADSENSE_CLIENT%";
        if (adsenseClient) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + adsenseClient;
          s.crossOrigin = 'anonymous';
          document.head.appendChild(s);
        }

        var adsterraKey = "%REACT_APP_ADSTERRA_KEY%";
        if (adsterraKey) {
          var a = document.createElement('script');
          a.async = true;
          a.src = '//www.topcreativeformat.com/' + adsterraKey + '/invoke.js';
          document.body.appendChild(a);
        }
      })();
    </script>
